name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Skill Archives
        run: |
          mkdir -p dist
          # Package skill directory as tar.gz
          tar -czf dist/typescript-design-patterns.tar.gz -C skills/typescript-design-patterns .
          # Package skill directory as zip
          cd skills/typescript-design-patterns
          zip -r ../../dist/typescript-design-patterns.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/typescript-design-patterns.tar.gz
            dist/typescript-design-patterns.zip
